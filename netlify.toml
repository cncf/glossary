[build]
publish = "public"
command = "make production-build"

[build.environment]
NODE_VERSION = "24"
HUGO_VERSION = "0.146.0"
GO_VERSION = "1.22"

[context.production.environment]
HUGO_ENV = "production"

[context.deploy-preview.environment]
HUGO_ENV = "preview"

[context.deploy-preview]
command = "make preview-build"

[context.branch-deploy]
command = "make preview-build"

# Serve a page's Markdown version to clients that ask for it with
# `Accept: text/markdown` (AI agents). The header condition means the function
# never runs for browsers; the CDN serves HTML as before.
[[edge_functions]]
function = "markdown-negotiation"
path = "/*"
excludedPath = ["/*.*", "/search/", "/*/search/"]
[edge_functions.header]
accept = "text/markdown"
